version: '3.8'

services:
  # Aplicación Web Express
  app:
    image: node:20-alpine
    container_name: compose-webapp
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db-uni-quindio
      - DB_USER=admin_quindio
      - DB_PASSWORD=76522002
      - DB_NAME=uni_quindio_db
      - DB_PORT=3306
      - PG_HOST=db-postgres-quindio
      - PG_USER=analyst_quindio
      - PG_PASSWORD=analytics_2026
      - PG_DATABASE=analytics_db
      - PG_PORT=5432
      - REDIS_HOST=redis-cache-quindio
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_quindio_2026
    volumes:
      - ../files/app-data:/app/data
    depends_on:
      - db-uni-quindio
      - db-postgres-quindio
      - redis-cache-quindio
    networks:
      - compose-net
    restart: unless-stopped

  # Base de datos MySQL
  db-uni-quindio:
    image: mysql:8.0
    container_name: compose-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=76522002
      - MYSQL_DATABASE=uni_quindio_db
      - MYSQL_USER=admin_quindio
      - MYSQL_PASSWORD=76522002
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - compose-net
    restart: unless-stopped

  # Base de datos PostgreSQL
  db-postgres-quindio:
    image: postgres:16
    container_name: compose-postgres
    environment:
      - POSTGRES_DB=analytics_db
      - POSTGRES_USER=analyst_quindio
      - POSTGRES_PASSWORD=analytics_2026
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - compose-net
    restart: unless-stopped

  # Base de datos / Caché Redis
  redis-cache-quindio:
    image: redis:alpine
    container_name: compose-redis
    command: redis-server --requirepass redis_quindio_2026
    volumes:
      - redis-data:/data
    networks:
      - compose-net
    restart: unless-stopped

volumes:
  mysql-data:
  postgres-data:
  redis-data:

networks:
  compose-net:
    driver: bridge
