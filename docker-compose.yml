version: '3.8'

services:
  webapp:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mysql-db
      - DB_USER=admin_user
      - DB_PASSWORD=clave_segura_123
      - DB_NAME=uniquindio_db
      - DB_PORT=3306
      - PG_HOST=postgres-db
      - PG_USER=postgres_user
      - PG_PASSWORD=clave_postgres_123
      - PG_DATABASE=uniquindio_pg_db
      - PG_PORT=5432
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - REDIS_PASSWORD=clave_redis_123
    depends_on:
      - mysql-db
      - postgres-db
      - redis-cache

  mysql-db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: uniquindio_db
      MYSQL_USER: admin_user
      MYSQL_PASSWORD: clave_segura_123
      MYSQL_ROOT_PASSWORD: root_clave_123
    volumes:
      - mysql_data:/var/lib/mysql

  postgres-db:
    image: postgres:18
    environment:
      POSTGRES_DB: uniquindio_pg_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: clave_postgres_123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis-cache:
    image: redis:8
    command: redis-server --requirepass clave_redis_123
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  postgres_data:
  redis_data:
